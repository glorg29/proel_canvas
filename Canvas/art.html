<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML5 Canvas Art</title>
  <style>
    body {
      margin: 24px 12px;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #222;
    }

    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, 200px);
      justify-content: center;
      gap: 20px;
      max-width: 860px;
      margin: auto;
    }

    figure {
      margin: 0;
    }

    canvas {
      display: block;
      background: #f3f3f3;
    }

    figcaption {
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h1>Canvas</h1>
  <main id="gallery"></main>

  <script>
    function createDrawing(name) {
      const figure = document.createElement("figure");
      const canvas = document.createElement("canvas");
      const caption = document.createElement("figcaption");

      canvas.width = 200;
      canvas.height = 200;
      canvas.setAttribute("role", "img");
      canvas.setAttribute("aria-label", name);
      caption.textContent = name;

      figure.append(canvas, caption);
      document.getElementById("gallery").append(figure);

      return canvas.getContext("2d");
    }

    function circle(ctx, x, y, radius, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function rectangle(ctx, x, y, width, height, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, width, height);
    }

    function polygon(ctx, points, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(...points[0]);

      for (const point of points.slice(1)) {
        ctx.lineTo(...point);
      }

      ctx.closePath();
      ctx.fill();
    }

    const pencil = createDrawing("Pencil");
    pencil.translate(100, 100);
    pencil.rotate(Math.PI / 4);
    rectangle(pencil, -10, -64, 20, 103, "#555");
    rectangle(pencil, -10, -75, 20, 11, "#aaa");
    polygon(pencil, [[-10, 39], [10, 39], [0, 67]], "#aaa");
    polygon(pencil, [[-3, 59], [3, 59], [0, 67]], "#222");

    const clock = createDrawing("Wall Clock");
    circle(clock, 100, 100, 64, "#444");
    circle(clock, 100, 100, 56, "white");

    for (let hour = 0; hour < 12; hour++) {
      const angle = hour * Math.PI / 6;
      const x = 100 + 47 * Math.cos(angle);
      const y = 100 + 47 * Math.sin(angle);
      circle(clock, x, y, 2, "#555");
    }

    clock.lineWidth = 5;
    clock.lineCap = "round";
    clock.beginPath();
    clock.moveTo(78, 86);
    clock.lineTo(100, 100);
    clock.lineTo(132, 79);
    clock.stroke();
    circle(clock, 100, 100, 4, "#333");

    const envelope = createDrawing("Envelope");
    rectangle(envelope, 30, 55, 140, 90, "#ccc");
    polygon(envelope, [[30, 55], [170, 55], [100, 112]], "#666");

    const notebook = createDrawing("Spiral Notebook");
    rectangle(notebook, 53, 39, 101, 129, "#666");
    rectangle(notebook, 50, 35, 101, 129, "white");
    notebook.strokeStyle = "#888";
    notebook.strokeRect(50, 35, 101, 129);

    for (let y = 52; y <= 148; y += 16) {
      rectangle(notebook, 43, y, 16, 4, "#444");
      rectangle(notebook, 71, y + 3, 64, 1, "#bbb");
    }

    const camera = createDrawing("Camera");
    polygon(camera, [[66, 76], [78, 55], [112, 55], [124, 76]], "#555");
    rectangle(camera, 30, 74, 140, 77, "#555");
    circle(camera, 100, 112, 29, "#ccc");
    circle(camera, 100, 112, 21, "#222");
    circle(camera, 92, 104, 5, "white");
    rectangle(camera, 140, 82, 16, 7, "white");

    const ruler = createDrawing("Ruler");
    ruler.translate(100, 100);
    ruler.rotate(-Math.PI / 6);
    rectangle(ruler, -75, -21, 150, 42, "#ccc");

    for (let mark = 0; mark <= 14; mark++) {
      const height = mark % 2 === 0 ? 17 : 10;
      rectangle(ruler, -70 + mark * 10, -21, 2, height, "#444");
    }

    const lamp = createDrawing("Desk Lamp");
    lamp.lineWidth = 7;
    lamp.strokeStyle = "#555";
    lamp.beginPath();
    lamp.moveTo(88, 154);
    lamp.lineTo(63, 103);
    lamp.lineTo(112, 59);
    lamp.stroke();

    circle(lamp, 63, 103, 7, "#333");
    circle(lamp, 131, 86, 9, "#aaa");
    polygon(lamp, [[104, 55], [121, 45], [151, 79], [116, 98]], "#555");
    rectangle(lamp, 55, 153, 69, 9, "#333");

    const headphones = createDrawing("Headphones");
    headphones.lineWidth = 11;
    headphones.strokeStyle = "#555";
    headphones.beginPath();
    headphones.arc(100, 101, 54, Math.PI, 2 * Math.PI);
    headphones.stroke();

    rectangle(headphones, 40, 98, 23, 46, "#333");
    rectangle(headphones, 137, 98, 23, 46, "#333");
    rectangle(headphones, 59, 103, 8, 36, "#aaa");
    rectangle(headphones, 133, 103, 8, 36, "#aaa");
  </script>
</body>
</html>
